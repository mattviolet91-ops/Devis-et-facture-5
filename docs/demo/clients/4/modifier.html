    <header class="entete">
                    <a href="../4.html" class="retour" data-retour>‹ Retour</a>
                <h1>Modifier le client</h1>
                    <a class="bouton-aide" href="../../guide__r-clients.html" aria-label="Aide sur cette page">?</a>
            </header>

    <main id="contenu" class="contenu" tabindex="-1">
                    <p class="bandeau-demo">Démonstration : toutes les données sont fictives.</p>
        
        
                
            
    
    <form method="post" action="../4.html" class="carte" novalidate>
        <input type="hidden" name="_token" value="uoVdwEtn3VrsJ2FcpFrTEGXfk4xma1UlW5G6eb7N" autocomplete="off">                    <input type="hidden" name="_method" value="put">        
        <fieldset class="segments segments-2">
            <legend>Type de client</legend>
                            <label><input type="radio" name="type" value="particulier" data-type-client checked><span>Particulier</span></label>
                            <label><input type="radio" name="type" value="professionnel" data-type-client ><span>Professionnel</span></label>
                    </fieldset>

        <div data-pour-type="professionnel">
            <div class="champ">
    <label for="raison_sociale">Nom de la société</label>
    <input type="text" id="raison_sociale" name="raison_sociale" value=""
           autocomplete="organization"
                      >
        </div>
            <div class="champ">
    <label for="siret">SIRET (facultatif)</label>
    <input type="text" id="siret" name="siret" value=""
           inputmode="numeric"
                      >
        </div>
            <div class="champ">
    <label for="tva_intracom">N° de TVA intracommunautaire (facultatif)</label>
    <input type="text" id="tva_intracom" name="tva_intracom" value=""
           
                      >
        </div>
            <p class="etiquette">Personne à contacter</p>
        </div>

        <div class="champ">
    <label for="civilite">Civilité</label>
    <select id="civilite" name="civilite" 
                >
                    <option value="">— Choisir —</option>
                            <option value="M." selected>M.</option>
                    <option value="Mme" >Mme</option>
                    <option value="M. et Mme" >M. et Mme</option>
            </select>
        </div>
        <div class="champ">
    <label for="nom">Nom</label>
    <input type="text" id="nom" name="nom" value="Durand"
           autocomplete="family-name" autocapitalize="words"
                      >
        </div>
        <div class="champ">
    <label for="prenom">Prénom</label>
    <input type="text" id="prenom" name="prenom" value="Jérôme"
           autocomplete="given-name" autocapitalize="words"
                      >
        </div>

        <div class="champ">
    <label for="telephone">Téléphone</label>
    <input type="tel" id="telephone" name="telephone" value="06 00 00 00 04"
           autocomplete="tel"
            aria-describedby="telephone-aide"            >
            <p class="aide" id="telephone-aide">Un téléphone ou un email est nécessaire.</p>
        </div>
        <div class="champ">
    <label for="telephone2">Autre téléphone</label>
    <input type="tel" id="telephone2" name="telephone2" value=""
           
                      >
        </div>
        <div class="champ">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="j.durand@exemple.test"
           autocomplete="email" inputmode="email"
                      >
        </div>

        <div class="champ">
    <label for="adresse">Adresse</label>
    <input type="text" id="adresse" name="adresse" value="21 avenue de la Gare"
           autocomplete="street-address"
                      >
        </div>
        <div class="champ">
    <label for="code_postal">Code postal</label>
    <input type="text" id="code_postal" name="code_postal" value="00100"
           inputmode="numeric" autocomplete="postal-code"
                      >
        </div>
        <div class="champ">
    <label for="ville">Ville</label>
    <input type="text" id="ville" name="ville" value="Ville-Démo"
           autocomplete="address-level2"
                      >
        </div>

        <div class="champ">
    <label for="provenance">Comment nous a-t-il connus ?</label>
    <select id="provenance" name="provenance" 
                >
                    <option value="">— Choisir —</option>
                            <option value="Bouche-à-oreille" >Bouche-à-oreille</option>
                    <option value="Site internet" selected>Site internet</option>
                    <option value="Recherche Google" >Recherche Google</option>
                    <option value="Facebook / Instagram" >Facebook / Instagram</option>
                    <option value="Pages Jaunes" >Pages Jaunes</option>
                    <option value="Panneau de chantier" >Panneau de chantier</option>
                    <option value="Véhicule de l&#039;entreprise" >Véhicule de l&#039;entreprise</option>
                    <option value="Déjà client" >Déjà client</option>
                    <option value="Recommandé par un professionnel" >Recommandé par un professionnel</option>
                    <option value="Autre" >Autre</option>
            </select>
        </div>
        <div class="champ">
    <label for="provenance_detail">Précision (facultatif)</label>
    <input type="text" id="provenance_detail" name="provenance_detail" value=""
           
            aria-describedby="provenance_detail-aide"            >
            <p class="aide" id="provenance_detail-aide">Par exemple : recommandé par M. Durand.</p>
        </div>

        
        <button type="submit" class="bouton bouton-large">Enregistrer</button>
    </form>
